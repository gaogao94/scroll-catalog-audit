[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scroll-catalog-audit"
version = "0.2.0"
description = "Read-only consistency audit for the Vesuvius Challenge open-data catalog"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
scroll-catalog-audit = "scroll_catalog_audit.audit:main"

[tool.setuptools]
packages = ["scroll_catalog_audit"]
