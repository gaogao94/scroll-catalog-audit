name: catalog-audit

on:
  workflow_dispatch:
  schedule:
    # weekly, so a catalog update cannot quietly grow the findings list
    - cron: "17 6 * * 1"
  pull_request:
  push:
    branches: [main]

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline unit checks
        run: python -m scroll_catalog_audit.audit selftest
      - name: Structural assertions over the committed evidence
        # Deliberately structural rather than totals, so a growing catalog does not fail the build
        # but a catalog that starts filling blanks with a non-zero value, or publishing a chunk
        # larger than its array, does. Covers the headers and levels evidence, not just the catalog.
        run: python -m scroll_catalog_audit.asserts
      - name: The commands the README tells people to run
        # A fresh clone runs these first. Without scroll_catalog_audit/__main__.py the documented
        # `python -m scroll_catalog_audit <sub>` form fails while the CI form keeps working, so both
        # spellings are exercised here rather than trusted.
        run: |
          python -m scroll_catalog_audit selftest
          python -m scroll_catalog_audit.asserts
          python -m scroll_catalog_audit asserts
          python -m scroll_catalog_audit demo
          python -m scroll_catalog_audit siblings --path 8.64um-1.2m-116keV-volume-20250521151220
          python -m scroll_catalog_audit.audit selftest
      - name: The sweeps agree and the quoted figures still come out
        # Cross-checks results.jsonl / results_zarray.jsonl / results_levels.jsonl /
        # results_level_chunks.jsonl against each other and restates every headline figure from the
        # committed data, so a number copied from an older run fails here.
        run: python -m scroll_catalog_audit verify
      - name: The committed sweep is still true
        # A canary, not coverage - but drawn from the population that can actually change. If a
        # publisher fixes one of the 77 stores the audit reports, this fails and the published numbers
        # get updated rather than quietly going stale. Sampling all 894 roots instead would cover 2 %
        # of the catalog and about 2 % of the stores that matter.
        run: |
          python -m scroll_catalog_audit freshness --sample 8
          python -m scroll_catalog_audit freshness --label AXES_UNIT_MISSING --sample 24
          # The store whose six levels held no chunks (#1892) was removed upstream on 2026-10-05, so the
          # canary that used to watch it now asserts the opposite: the artifact stays gone. If it comes
          # back, the snapshot's most-quoted finding is live again and the write-up needs updating.
          python - <<'PY'
          import urllib.error
          import urllib.request
          url = ("https://vesuvius-challenge-open-data.s3.amazonaws.com/PHerc0814/segments/"
                 "20260226123353-auto_grown_20260226123353106/surface-volumes/"
                 "1.129um-0.22m-59keV-volume-20260521123630-L1.zarr/.zattrs")
          request = urllib.request.Request(url, method="HEAD", headers={"User-Agent": "audit-ci"})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  code = response.status
          except urllib.error.HTTPError as exc:
              code = exc.code
          print("empty store .zattrs ->", code)
          assert code == 404, f"the #1892 store is back ({code}); update the documents"
          PY

      - name: The guards still guard
        # Both of these were wrong once: `--limit 0` was falsy and therefore ran the whole catalog
        # (~1,860 requests), and a missing results file produced a traceback instead of a sentence.
        run: |
          if python -m scroll_catalog_audit scan --limit 0 --results /tmp/never.jsonl; then
            echo "::error::--limit 0 was accepted and would scan everything"; exit 1
          fi
          if python -m scroll_catalog_audit report --results /tmp/does-not-exist.jsonl --out /tmp/y.md; then
            echo "::error::a missing results file was not reported"; exit 1
          fi
      - name: The manifest checks report exactly what is already filed
        # The full catalog file, because creation dates, original_volume_id, transforms and the
        # provenance blocks exist only there. Manifest exits 1 on the one filed defect, so the step
        # tolerates that and asserts instead that no *other* code has appeared. The extraction is in
        # Python because the first attempt used sed and silently captured only the severity word.
        run: |
          curl -sSL -o /tmp/metadata.json \
            https://vesuvius-challenge-open-data.s3.amazonaws.com/metadata.json
          python -m scroll_catalog_audit manifest --catalog /tmp/metadata.json > /tmp/manifest.txt || true
          cat /tmp/manifest.txt
          python - <<'PY'
          import re
          allowed = {
              "ERROR MODEL_SAMPLE_MISSING",
              "WARN PROVENANCE_DIRTY_ALWAYS",
              "WARN PROVENANCE_OUTPUT_MISMATCH",
          }
          text = open("/tmp/manifest.txt", encoding="utf-8").read()
          found = {f"{m.group(1)} {m.group(2)}"
                   for m in re.finditer(r"^\s*\[(ERROR|WARN)\] ([A-Z_]+):", text, re.M)}
          print("codes:", sorted(found))
          # Equality of the *set* is not enough: a second output-path mismatch would keep the same code
          # and change the count, leaving the published "1 mismatched" wrong while the build stayed
          # green. Codes and counts are both asserted, and so is the provenance summary line.
          counts = {f"{m.group(1)} {m.group(2)}": int(m.group(3))
                    for m in re.finditer(r"^\s*\[(ERROR|WARN)\] ([A-Z_]+): (\d+)", text, re.M)}
          expected_counts = {
              "ERROR MODEL_SAMPLE_MISSING": 1,
              "WARN PROVENANCE_DIRTY_ALWAYS": 1,
              "WARN PROVENANCE_OUTPUT_MISMATCH": 1,
          }
          assert found == allowed, (
              f"manifest findings changed: missing {sorted(allowed - found)}, "
              f"new {sorted(found - allowed)} - update the documents and this list"
          )
          assert counts == expected_counts, (
              f"manifest finding counts changed: {counts} - update the documents and this list"
          )
          summary = re.search(
              r"provenance: (\d+) records, (\d+) with atlas_git_dirty=true, "
              r"(\d+) output-paths compared, (\d+) mismatched", text)
          assert summary, "the provenance summary line is missing"
          assert summary.groups() == ("3839", "3834", "2500", "1"), (
              f"provenance summary changed: {summary.groups()} - update the documents and this list"
          )
          PY

  docs-in-sync:
    # Every number quoted in the README, SUBMISSION and contrib/ files must be reproducible
    # from the committed results. This job regenerates the reports and fails on any diff, so a
    # hand-edited count cannot survive.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate every committed report from the committed data
        run: |
          set -eux
          # results_alt.jsonl carries the ten origins that resolve on a declared alternate root
          python -m scroll_catalog_audit.audit report \
            --results results.jsonl --merge results_alt.jsonl --merge results_deep.jsonl \
            --out /tmp/FINDINGS.md --fixlist /tmp/fixlist.json
          python -m scroll_catalog_audit.audit report \
            --results results_deep.jsonl \
            --out /tmp/FINDINGS_deep.md --fixlist /tmp/fixlist_deep.json
          python -m scroll_catalog_audit.audit report \
            --results results_deep_seg.jsonl \
            --out /tmp/FINDINGS_deep_seg.md --fixlist /tmp/fixlist_deep_seg.json

      - name: Committed reports must be byte-identical to the regenerated ones
        run: |
          set -eux
          diff -u FINDINGS.md /tmp/FINDINGS.md
          diff -u fixlist.json /tmp/fixlist.json
          diff -u FINDINGS_deep.md /tmp/FINDINGS_deep.md
          diff -u fixlist_deep.json /tmp/fixlist_deep.json
          diff -u FINDINGS_deep_seg.md /tmp/FINDINGS_deep_seg.md
          diff -u fixlist_deep_seg.json /tmp/fixlist_deep_seg.json

      - name: Calibration cases must still reproduce the filed issues
        run: |
          set -eux
          # #1892: a store that declares levels but has no chunks
          python -m scroll_catalog_audit.audit explain \
            --results results.jsonl --path 20260226123353 | tee /tmp/cal1.txt
          grep -q "NO_CHUNKS_IN_FIRST_PAGE" /tmp/cal1.txt
          # #1951: a store whose name states a pitch the metadata does not carry
          python -m scroll_catalog_audit.audit explain \
            --results results.jsonl --path PHerc1447/segments/20250702235910 | tee /tmp/cal2.txt
          grep -q "SCALE_IS_UNIT" /tmp/cal2.txt

      - name: Headline counts must match the numbers quoted in the submission
        run: |
          set -eux
          python - <<'PY'
          import json, re, sys
          rows = [json.loads(l) for l in open("results.jsonl", encoding="utf-8") if l.strip()]
          text = open("FINDINGS.md", encoding="utf-8").read()
          s3 = [r for r in rows if not r.get("skipped")]
          units = sum(1 for r in s3 if r.get("units_present"))
          counts = {m: text.count(f"`{m}`") for m in
                    ("AXES_UNIT_MISSING", "SCALE_IS_UNIT", "NO_CHUNKS_IN_FIRST_PAGE")}
          print("S3 origins:", len(s3), "with units:", units, counts)
          assert len(s3) == 884, len(s3)
          assert units == 755, units
          assert counts["NO_CHUNKS_IN_FIRST_PAGE"] >= 1
          PY

  scan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit the published catalog (metadata only, no chunk bytes)
        run: python -m scroll_catalog_audit.audit scan --workers 10 --results results_fresh.jsonl
      - name: Build report
        run: python -m scroll_catalog_audit.audit report --results results_fresh.jsonl --out FINDINGS_fresh.md
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: catalog-audit-results
          path: |
            results_fresh.jsonl
            FINDINGS_fresh.md
